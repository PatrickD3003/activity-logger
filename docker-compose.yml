services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "19000:3000"
    environment:
      DATABASE_URL: "postgresql://factory_logger:censoredpass@postgres:5432/factory_logger"
      DATABASE_SSL: "false"
      APP_AUTH_MODE: "basic"
      APP_BASIC_USERNAME: "admin"
      APP_BASIC_PASSWORD: "boboi12345678987654321"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: factory_logger
      POSTGRES_USER: factory_logger
      POSTGRES_PASSWORD: censoredpass
    volumes:
      - factory_logger_postgres:/var/lib/postgresql/data
      - ./database/postgres-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  factory_logger_postgres:
